<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ليلو الاحترافي 🚀</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #ff758c;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>أهلاً بكم في موقع ليلو! 🚀</h1>
        <p>مبتكرة ومطورة مواقع مستقبلية ✨</p>
        <a href="#" class="btn">اضغط هنا للمزيد</a>
    </div>
</body>
</html>
